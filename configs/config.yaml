# ============================================================
# 生成式推荐系统 - 全局配置
# ============================================================

# --- 数据相关 ---
data:
  raw_dir: "data/raw"                    # 原始数据下载目录
  processed_dir: "data/processed"        # 预处理后数据目录
  min_user_interactions: 5               # 用户最少交互数（低于此值移除）
  min_item_interactions: 5               # 物品最少交互数（低于此值移除）
  train_ratio: 0.8                       # 训练集比例
  val_ratio: 0.1                         # 验证集比例（剩余为测试集）
  max_seq_len: 50                        # 用户交互序列最大长度

# --- 特征提取 ---
features:
  embedding_model: "all-MiniLM-L6-v2"    # Sentence Embedding 模型
  embedding_dim: 384                     # Sentence Embedding 维度
  num_genres: 18                         # 电影类别数量（ML-1M共18种）
  feature_dim: 402                       # 总特征维度 = 384 + 18

# --- 量化方式选择 ---
# 可选: "rq_vae" | "rq_kmeans" | "vq_vae"
sid_method: "rq_kmeans"

# --- 通用SID参数（三种方法共用）---
sid:
  input_dim: 402                         # 输入特征维度
  hidden_dim: 512                        # 隐藏层维度
  latent_dim: 128                        # 潜在空间维度
  codebook_size: 32                      # 每个码本的大小
  codebook_dim: 128                      # 码本向量维度
  commitment_weight: 1.0                 # commitment loss权重
  decay: 0.99                            # EMA衰减系数（RQ-VAE/VQ-VAE使用）
  epochs: 50                             # 训练轮数
  batch_size: 256                        # 批次大小
  lr: 0.0003                             # 学习率

# --- RQ-VAE特有参数 ---
rq_vae:
  num_codebooks: 3                       # 残差量化层数

# --- RQ-KMeans特有参数 ---
rq_kmeans:
  num_codebooks: 3                       # 残差量化层数
  encoder_pretrain_epochs: 30            # 编码器预训练轮数
  decoder_finetune_epochs: 20            # 解码器微调轮数
  cosine_anti_collapse_weight: 0.0       # SID阶段余弦反塌缩（0.0=关闭）
  cosine_level_weights: [0.3, 0.5, 1.0]

# --- VQ-VAE特有参数 ---
vq_vae:
  # VQ-VAE使用单层量化，codebook_size会适当增大
  # 因为没有多层级联来扩展语义空间
  codebook_size_override: 64             # VQ-VAE单独的码本大小（不设则用sid.codebook_size）

# --- Decoder（序列推荐模型）---
decoder:
  d_model: 128                           # 模型维度
  nhead: 4                               # 注意力头数
  num_layers: 4                          # Transformer层数
  dim_feedforward: 512                   # FFN维度
  dropout: 0.1                           # Dropout率
  special_token_size: 4                  # 特殊token数量（PAD=0, BOS=1, EOS=2, SEP=3）
  use_user_features: false               # 是否使用用户特征（需先运行02b_preprocess_users.py）
  diversity_penalty: 0.3                 # 历史code多样性惩罚权重（0.0=关闭，越大越抑制重复推荐）
  diversity_recent_n: 2                  # 只惩罚最近N个物品的历史code（0=全部历史）
  epochs: 10                             # 训练轮数
  batch_size: 128                        # 批次大小
  lr: 0.0001                             # 学习率
  weight_decay: 0.01                     # 权重衰减

# --- 评估 ---
eval:
  top_k: [5, 10, 20]                     # Recall@K 的K值
